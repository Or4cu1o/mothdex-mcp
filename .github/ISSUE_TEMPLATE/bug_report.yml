name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `node dist/mothdex-mcp.mjs` (version line) or the package version.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and architecture
      description: For example Windows 11 x64, macOS 26 arm64, Debian 13 x64; include the MCP client (Claude Desktop, Claude Code, Cursor...).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output or logs
      description: Remove any personal paths or tokens before pasting.
      render: shell
