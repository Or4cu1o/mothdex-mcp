name: Bug report
description: Something does not work as documented
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. A few details help us reproduce it quickly.
        For a vulnerability, please use the private security advisory link on the previous page instead.
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of mothdex-mcp is affected?
      options:
        - MCP server
        - Claude Code plugin
        - .mcpb (Claude Desktop extension)
        - npm package
    validations:
      required: true
  - type: dropdown
    id: installed-with
    attributes:
      label: How did you install it?
      options:
        - npm / npx
        - Claude Code plugin marketplace
        - .mcpb file
        - From source
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `npx mothdex-mcp --version`, or the server name and version your MCP client shows in its server info.
      placeholder: mothdex-mcp 0.1.0
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System and device
      description: Operating system, architecture and device. Also name the MCP client (Claude Desktop, Claude Code, Cursor...).
      placeholder: Windows 11 x64, Claude Desktop
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output or logs
      description: Remove personal paths and tokens before pasting.
      render: shell
